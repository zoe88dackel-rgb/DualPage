<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DualPage</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="ios-app">
    <header class="ios-header">
      <div class="ios-brand" id="popupBrandLink" title="打开 DualPage 主页">
        <img class="ios-app-icon" src="icons/icon128.png" alt="DualPage" />
        <div class="ios-title-group">
          <h1>DualPage</h1>
          <p class="ios-host" id="currentHost">正在读取页面...</p>
        </div>
      </div>
      <div class="ios-header-right">
        <button type="button" id="openOptionsBtn" class="ios-kbd ios-kbd-btn" title="打开独立 API 与高级配置页">API配置</button>
        <button type="button" id="openGuideBtn" class="ios-kbd" title="打开网页使用说明">说明</button>
      </div>
    </header>

    <div class="ios-hero">
      <button id="toggleBtn" class="ios-primary-btn">
        <span class="btn-dot"></span>
        <span id="toggleBtnText">开始实时翻译</span>
      </button>
    </div>

    <!-- 分组 1：显示与站点 -->
    <div class="ios-section-title">显示与站点</div>
    <div class="ios-group">
      <div class="ios-row ios-row-segment">
        <span class="ios-label">显示模式</span>
        <div class="ios-segmented" id="displayModeSegment">
          <button type="button" class="seg-btn active" data-value="replace">仅译文</button>
          <button type="button" class="seg-btn" data-value="bilingual">双语对照</button>
        </div>
      </div>

      <div class="ios-row">
        <span class="ios-label">目标语言</span>
        <select id="targetLangSelect" class="ios-inline-select">
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <label class="ios-row ios-row-clickable">
        <span class="ios-label">始终自动翻译当前网站</span>
        <span class="ios-switch">
          <input type="checkbox" id="autoDomainCheck" />
          <span class="ios-slider"></span>
        </span>
      </label>
    </div>

    <!-- 分组 2：翻译引擎 -->
    <div class="ios-section-title">翻译引擎</div>
    <div class="ios-group">
      <div class="ios-row">
        <span class="ios-label">引擎</span>
        <select id="engineSelect" class="ios-inline-select ios-inline-select-wide">
          <option value="pollinations">免费 AI · Pollinations（免 Key）</option>
          <option value="edge">微软 Edge（免 Key 高速直连）</option>
          <option value="google">Google（免 Key）</option>
          <option value="zhipu">免费 AI · 智谱 GLM-4-Flash</option>
          <option value="siliconflow">免费 AI · 硅基流动 Qwen</option>
          <option value="deepseek">AI · DeepSeek</option>
          <option value="openai">自定义 API（OpenAI 兼容）</option>
          <option value="gemini">AI · Gemini</option>
        </select>
      </div>

      <div id="aiConfigBox" class="ios-ai-fields hidden">
        <div class="ios-input-row">
          <span class="ios-input-label">API Key</span>
          <input type="password" id="aiApiKey" placeholder="填入 API Key" />
        </div>
        <div class="ios-input-row" id="baseUrlField">
          <span class="ios-input-label">接口地址</span>
          <input type="text" id="aiBaseUrl" placeholder="https://api.deepseek.com/v1" />
        </div>
        <div class="ios-input-row">
          <span class="ios-input-label">模型名称</span>
          <input type="text" id="aiModel" placeholder="deepseek-chat" />
        </div>
        <div class="ios-ai-save-wrap">
          <button type="button" id="testEngineBtn" class="ios-ghost-btn">测试连接</button>
          <button type="button" id="saveAiBtn" class="ios-tint-btn">保存并应用</button>
        </div>
      </div>
    </div>

    <!-- 分组 3：智能功能与术语 -->
    <div class="ios-section-title">智能功能</div>
    <div class="ios-group">
      <label class="ios-row ios-row-clickable">
        <div class="ios-label-stack">
          <span class="ios-label">划词即译（带朗读/复制）</span>
          <span class="ios-sublabel">选中网页文字自动弹出译文气泡</span>
        </div>
        <span class="ios-switch">
          <input type="checkbox" id="selectionCheck" />
          <span class="ios-slider"></span>
        </span>
      </label>

      <label class="ios-row ios-row-clickable">
        <div class="ios-label-stack">
          <span class="ios-label">图片与框选译图 (Alt+I)</span>
          <span class="ios-sublabel">悬停图片显示「译图」或右键译图</span>
        </div>
        <span class="ios-switch">
          <input type="checkbox" id="imageTranslateCheck" />
          <span class="ios-slider"></span>
        </span>
      </label>

      <label class="ios-row ios-row-clickable">
        <div class="ios-label-stack">
          <span class="ios-label">术语库精准优化</span>
          <span class="ios-sublabel">优先应用内置与自定义术语对照</span>
        </div>
        <span class="ios-switch">
          <input type="checkbox" id="glossaryCheck" />
          <span class="ios-slider"></span>
        </span>
      </label>

      <label class="ios-row ios-row-clickable">
        <span class="ios-label">显示可拖动悬浮球</span>
        <span class="ios-switch">
          <input type="checkbox" id="floatingBtnCheck" />
          <span class="ios-slider"></span>
        </span>
      </label>

      <button type="button" id="toggleGlossaryEditor" class="ios-row ios-row-btn">
        <span class="ios-label">自定义术语表</span>
        <span class="ios-chevron" id="glossaryChevron">展开 ›</span>
      </button>

      <div id="customGlossaryBox" class="ios-glossary-box hidden">
        <textarea id="customGlossaryInput" rows="3" placeholder="每行一条，格式：原文=译文&#10;例如：Фулфилмент=官方仓履约"></textarea>
        <div class="ios-ai-save-wrap">
          <button type="button" id="saveGlossaryBtn" class="ios-tint-btn">保存术语表</button>
        </div>
      </div>
    </div>

    <div id="statusMsg" class="ios-status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
